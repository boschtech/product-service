server:
  port: ${PORT:8080}

spring:
  application:
    name: product-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Actuator endpoints — only health, no internal details
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# Custom CORS config
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}
  security:
    api-key: ${API_KEY:changeme-dev-only}
